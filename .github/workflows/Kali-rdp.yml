name: Kali Linux NetHunter KeX (VNC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling
      options: --privileged --shm-size=2g

    steps:
      - name: Install Kali XFCE & TigerVNC (KeX Server)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            kali-desktop-xfce \
            kali-themes \
            elementary-xfce-icon-theme \
            tigervnc-standalone-server \
            tigervnc-common \
            dbus-x11 \
            curl \
            sudo \
            iproute2 \
            iptables \
            ca-certificates \
            firefox-esr

      - name: Configure KeX / VNC Server
        run: |
          # ইউজার ও পাসওয়ার্ড সেটআপ
          useradd -m -s /bin/bash kali || true
          echo "kali:kali123" | chpasswd
          usermod -aG sudo kali

          # VNC/KeX পাসওয়ার্ড 'kali123' সেট করা হচ্ছে
          mkdir -p /home/kali/.vnc
          echo "kali123" | vncpasswd -f > /home/kali/.vnc/passwd
          chmod 600 /home/kali/.vnc/passwd

          # ডেক্সটপ স্টার্টআপ ফাইল তৈরি
          cat << 'EOF' > /home/kali/.vnc/xstartup
          #!/bin/bash
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec dbus-launch --exit-with-session startxfce4
          EOF
          chmod +x /home/kali/.vnc/xstartup
          chown -R kali:kali /home/kali/.vnc

          # পোর্ট 5901-এ VNC (KeX) সার্ভার চালু করা
          service dbus start
          su - kali -c "vncserver :1 -geometry 1280x720 -depth 24 -localhost no"

      - name: Install & Connect Tailscale
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh || true
          nohup tailscaled --tun=userspace-networking --socks5-server=localhost:1055 > tailscaled.log 2>&1 &
          sleep 5
          tailscale up --authkey="$TS_KEY" --hostname=kali-kex --accept-routes

      - name: Get NetHunter KeX Login Details
        run: |
          echo "=========================================="
          echo "✅ Kali NetHunter KeX Ready!"
          echo "VNC / KeX Address: $(tailscale ip -4)"
          echo "Port: 5901"
          echo "KeX Password: kali123"
          echo "=========================================="

      - name: Keep Alive (Up to 6 Hours)
        run: sleep 21000
