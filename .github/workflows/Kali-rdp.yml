name: Kali Linux Dedicated Fast RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling
      options: --privileged --shm-size=2g

    steps:
      - name: Install Full Kali XFCE & XRDP
        run: |
          # আইকন ও থিম যেন ডিলিট না হয়
          rm -f /etc/dpkg/dpkg.cfg.d/docker
          rm -f /etc/dpkg/dpkg.cfg.d/excludes
          rm -f /etc/apt/apt.conf.d/docker-*

          echo "deb http://kali.download/kali kali-rolling main contrib non-free non-free-firmware" > /etc/apt/sources.list
          apt-get update -o Acquire::Retries=3

          DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 --fix-missing \
            kali-desktop-xfce \
            kali-themes \
            kali-wallpapers-all \
            elementary-xfce-icon-theme \
            adwaita-icon-theme-full \
            hicolor-icon-theme \
            librsvg2-common \
            gdk-pixbuf2.0-bin \
            xorg \
            xorgxrdp \
            xserver-xorg-core \
            xrdp \
            dbus-x11 \
            x11-xserver-utils \
            net-tools \
            curl \
            sudo \
            iproute2 \
            iptables \
            ca-certificates \
            firefox-esr

          # মিসিং আইকন রিস্টোর ও ক্যাশ আপডেট
          DEBIAN_FRONTEND=noninteractive apt-get install --reinstall -y \
            kali-themes kali-themes-common desktop-base libgtk-3-common xfce4-panel xfdesktop4 xfwm4

          /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders --update-cache || true
          for dir in /usr/share/icons/*; do
            if [ -d "$dir" ]; then
              gtk-update-icon-cache -f -t "$dir" || true
            fi
          done

      - name: Configure & Force Start XRDP (Port 3389)
        run: |
          useradd -m -s /bin/bash kali || true
          echo "kali:kali123" | chpasswd
          echo "root:kali123" | chpasswd
          usermod -aG sudo kali
          adduser xrdp ssl-cert || true

          # কন্টেইনারে Xorg পারমিশন দেওয়া
          mkdir -p /etc/X11
          echo "allowed_users=anybody" > /etc/X11/Xwrapper.config
          echo "needs_root_rights=yes" >> /etc/X11/Xwrapper.config

          # ডেক্সটপ স্টার্টআপ স্ক্রিপ্ট (স্মুথ পারফরম্যান্সের জন্য Compositor অফ রাখা হয়েছে)
          cat << 'EOF' > /etc/xrdp/startwm.sh
          #!/bin/bash
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          export XDG_CURRENT_DESKTOP=XFCE
          export DESKTOP_SESSION=xfce
          (sleep 3 && xfconf-query -c xfwm4 -p /general/use_compositing -s false) &
          exec dbus-launch --exit-with-session startxfce4
          EOF
          chmod +x /etc/xrdp/startwm.sh

          # DBUS চালু করা
          mkdir -p /var/run/dbus
          dbus-daemon --config-file=/usr/share/dbus-1/system.conf --print-address || service dbus start

          # XRDP কী-জেনারেশন এবং সরাসরি বাইনারি রান করা (যাতে কখনো বন্ধ না হয়)
          rm -rf /var/run/xrdp*.pid /var/run/xrdp/*.pid
          mkdir -p /var/run/xrdp
          chown -R xrdp:xrdp /var/run/xrdp
          xrdp-keygen xrdp auto || true
          
          /usr/sbin/xrdp-sesman
          /usr/sbin/xrdp

          # পোর্ট 3389 চালু হয়েছে কি না তা কনফার্ম করা
          sleep 2
          netstat -tulnp | grep 3389

      - name: Install & Connect Tailscale
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh || true
          nohup tailscaled --tun=userspace-networking --socks5-server=localhost:1055 > tailscaled.log 2>&1 &
          sleep 5
          tailscale up --authkey="$TS_KEY" --hostname=kali-rdp --accept-routes

      - name: Get RDP Login Details
        run: |
          echo "=========================================="
          echo "✅ Kali Linux RDP Server Running on Port 3389!"
          echo "Host / IP: $(tailscale ip -4)"
          echo "Port: 3389"
          echo "Username: kali (অথবা root)"
          echo "Password: kali123"
          echo "=========================================="

      - name: Keep Alive (Up to 6 Hours)
        run: sleep 21000
