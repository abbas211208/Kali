name: Kali Linux NetHunter KeX (Fixed Connection)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling
      options: --privileged --shm-size=2g

    steps:
      - name: Remove Docker Restrictions & Install Full XFCE
        run: |
          # আইকন ও থিম ডিলিট হওয়া বন্ধ করার জন্য ডকারের রেস্ট্রিকশন ফাইল মুছে ফেলা হচ্ছে
          rm -f /etc/dpkg/dpkg.cfg.d/docker
          rm -f /etc/dpkg/dpkg.cfg.d/excludes
          rm -f /etc/apt/apt.conf.d/docker-*

          echo "deb http://kali.download/kali kali-rolling main contrib non-free non-free-firmware" > /etc/apt/sources.list
          apt-get update -o Acquire::Retries=3

          DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 --fix-missing \
            kali-desktop-xfce \
            kali-themes \
            kali-wallpapers-all \
            elementary-xfce-icon-theme \
            adwaita-icon-theme-full \
            hicolor-icon-theme \
            librsvg2-common \
            gdk-pixbuf2.0-bin \
            tigervnc-standalone-server \
            tigervnc-common \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            x11-xserver-utils \
            net-tools \
            curl \
            sudo \
            iproute2 \
            iptables \
            ca-certificates \
            firefox-esr

          # আগে থেকে ইনস্টল থাকা প্যাকেজগুলোর মিসিং আইকন রিস্টোর করা
          DEBIAN_FRONTEND=noninteractive apt-get install --reinstall -y \
            kali-themes kali-themes-common desktop-base libgtk-3-common xfce4-panel xfdesktop4 xfwm4

          # আইকন ক্যাশ আপডেট
          /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders --update-cache || true
          for dir in /usr/share/icons/*; do
            if [ -d "$dir" ]; then
              gtk-update-icon-cache -f -t "$dir" || true
            fi
          done

      - name: Start VNC (Port 5901) & RDP (Port 3389)
        run: |
          useradd -m -s /bin/bash kali || true
          echo "kali:kali123" | chpasswd
          echo "root:kali123" | chpasswd
          usermod -aG sudo kali

          # root এবং kali উভয় ইউজারের জন্য VNC পাসওয়ার্ড সেটআপ
          mkdir -p /root/.vnc /home/kali/.vnc
          echo "kali123" | vncpasswd -f > /root/.vnc/passwd
          echo "kali123" | vncpasswd -f > /home/kali/.vnc/passwd
          chmod 600 /root/.vnc/passwd /home/kali/.vnc/passwd

          # সিম্পল এবং ক্র্যাশ-মুক্ত xstartup স্ক্রিপ্ট
          cat << 'EOF' > /root/.vnc/xstartup
          #!/bin/bash
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_CURRENT_DESKTOP=XFCE
          export DESKTOP_SESSION=xfce
          (sleep 4 && xfconf-query -c xfwm4 -p /general/use_compositing -s false) &
          exec dbus-launch --exit-with-session startxfce4
          EOF

          chmod +x /root/.vnc/xstartup
          cp /root/.vnc/xstartup /home/kali/.vnc/xstartup
          chown -R kali:kali /home/kali/.vnc

          # DBUS চালু করা
          mkdir -p /var/run/dbus
          dbus-daemon --config-file=/usr/share/dbus-1/system.conf --print-address || service dbus start

          # পুরোনো কোনো লক ফাইল থাকলে মুছে পোর্ট 5901-এ VNC সার্ভার চালু করা
          rm -rf /tmp/.X1-lock /tmp/.X11-unix/X1
          vncserver :1 -geometry 1280x720 -depth 24 -localhost no

          # ব্যাকআপ হিসেবে XRDP (Port 3389)-ও চালু রাখা হলো
          cp /root/.vnc/xstartup /etc/xrdp/startwm.sh
          chmod +x /etc/xrdp/startwm.sh
          service xrdp start || true

          # পোর্ট 5901 চালু আছে কি না তা লগে চেক করা
          netstat -tulnp | grep 5901

      - name: Install & Connect Tailscale
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh || true
          nohup tailscaled --tun=userspace-networking --socks5-server=localhost:1055 > tailscaled.log 2>&1 &
          sleep 5
          tailscale up --authkey="$TS_KEY" --hostname=kali-kex --accept-routes

      - name: Get NetHunter KeX Login Details
        run: |
          echo "=========================================="
          echo "✅ Kali NetHunter KeX & RDP Ready!"
          echo "New Tailscale IP: $(tailscale ip -4)"
          echo "NetHunter KeX Port: 5901"
          echo "RDP Port: 3389"
          echo "Username: root (অথবা kali)"
          echo "Password: kali123"
          echo "=========================================="

      - name: Keep Alive (Up to 6 Hours)
        run: sleep 21000
